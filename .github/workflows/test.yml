name: Test Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:

  prepare:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Merge pull request') }}
    outputs:
      version: ${{ steps.set-ver.outputs.version }}
      versionL: ${{ steps.set-ver.outputs.versionL }}
      lanzou: ${{ steps.check.outputs.lanzou }}
      telegram: ${{ steps.check.outputs.telegram }}
    steps:
      - id: set-ver
        run: |
          echo "version=$(date -d "8 hour" -u +3.%y.%m%d%H)" >> $GITHUB_OUTPUT
          echo "versionL=$(date -d "8 hour" -u +3.%y.%m%d%H%M)" >> $GITHUB_OUTPUT
      - id: check
        env:
          LANZOU_ID: ${{ secrets.LANZOU_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          if [[ -n "$LANZOU_ID" ]]; then
            echo "lanzou=yes" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$BOT_TOKEN" ]]; then
            echo "telegram=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      matrix:
        product: [ app ]
        type: [ release ]
      fail-fast: true
    runs-on: ubuntu-latest
    env:
      product: ${{ matrix.product }}
      type: ${{ matrix.type }}
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSIONL: ${{ needs.prepare.outputs.versionL }}
      RHINO_FORK_REPO: ${{ github.repository_owner }}/htmlunit-rhino-fork
      RHINO_FORK_REF: c758621a0df4ec5687901570dc355c1f98f32652
      CORE_JS_REPO: ${{ github.repository_owner }}/htmlunit-core-js
      CORE_JS_REF: e31799f290b50f99fe2cef1f14acd9725f69653c
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout htmlunit-rhino-fork
        uses: actions/checkout@v7
        with:
          repository: ${{ env.RHINO_FORK_REPO }}
          ref: ${{ env.RHINO_FORK_REF }}
          path: htmlunit-rhino-fork

      - name: Checkout htmlunit-core-js
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_JS_REPO }}
          ref: ${{ env.CORE_JS_REF }}
          path: htmlunit-core-js

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven

      - name: Install Forked htmlunit-core-js To mavenLocal
        working-directory: htmlunit-core-js
        run: |
          mvn --batch-mode --no-transfer-progress install -Dmaven.test.skip=true -Dgpg.skip=true -Dmaven.javadoc.skip=true

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "">$GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt
      - name: Release Apk Sign
        run: |
          echo "给apk增加签名"
          cp $GITHUB_WORKSPACE/.github/workflows/legado.jks $GITHUB_WORKSPACE/app/legado.jks
          sed '$a\RELEASE_STORE_FILE=./legado.jks'          $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_ALIAS=legado'                 $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_STORE_PASSWORD=gedoor_legado'     $GITHUB_WORKSPACE/gradle.properties -i
          sed '$a\RELEASE_KEY_PASSWORD=gedoor_legado'       $GITHUB_WORKSPACE/gradle.properties -i

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build With Gradle
        run: |
          if [ ${{ env.type }} == 'release' ]; then
            typeName="原包名"
          fi
          echo "统一版本号"
          sed "/def version/c def version = \"${{ env.VERSION }}\"" $GITHUB_WORKSPACE/app/build.gradle  -i
          echo "开始${{ env.product }}$typeName构建"
          chmod +x gradlew
          ./gradlew assemble${{ env.product }}release --build-cache --parallel --warning-mode all
          echo "修改APK文件名"
          mkdir -p "${{ github.workspace }}/apk/"
          shopt -s nullglob
          apk_files=("${{ github.workspace }}"/app/build/outputs/apk/*/*/*.apk)
          if [ "${#apk_files[@]}" -ne 3 ]; then
            echo "Expected 3 ABI APKs, found ${#apk_files[@]}"
            exit 1
          fi
          found_abis=()
          for file in "${apk_files[@]}"; do
            base=$(basename "$file" .apk)
            abi=$(echo "$base" | grep -oE 'arm64-v8a|armeabi-v7a|x86_64' || true)
            if [ -z "$abi" ]; then
              echo "Cannot determine ABI from APK: $base"
              exit 1
            fi
            if [[ " ${found_abis[*]} " == *" $abi "* ]]; then
              echo "Duplicate ABI APK: $abi"
              exit 1
            fi
            found_abis+=("$abi")
            mv "$file" "${{ github.workspace }}/apk/legado_${{ env.product }}_${{ env.VERSIONL }}_${abi}_$typeName.apk"
          done
          echo "移动mapping文件"
          mkdir -p "${{ github.workspace }}/mapping/"
          mapping_files=("${{ github.workspace }}"/app/build/outputs/mapping/*/mapping.txt)
          if [ "${#mapping_files[@]}" -ne 1 ]; then
            echo "Expected one mapping.txt, found ${#mapping_files[@]}"
            exit 1
          fi
          mv "${mapping_files[0]}" "${{ github.workspace }}/mapping/mapping.txt"

      - name: Move Missing Rules Files
        run: |
          echo "移动missing_rules.txt文件"
          mkdir -p "${{ github.workspace }}/mapping/"
          shopt -s nullglob
          missing_rules_files=("${{ github.workspace }}"/app/build/outputs/mapping/*/missing_rules.txt)
          if [ "${#missing_rules_files[@]}" -gt 1 ]; then
            echo "Expected at most one missing_rules.txt, found ${#missing_rules_files[@]}"
            exit 1
          fi
          if [ "${#missing_rules_files[@]}" -eq 1 ]; then
            mv "${missing_rules_files[0]}" "${{ github.workspace }}/mapping/missing_rules.txt"
          fi

      - name: Upload Missing Rules File To Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping.missing_rules
          if-no-files-found: ignore
          path: ${{ github.workspace }}/mapping/missing_rules.txt

      - name: Check Build production
        run: |
          shopt -s nullglob
          apk_files=("${{ github.workspace }}"/apk/legado_*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "Build production not found! Check Gradle logs."
            exit 1
          fi

      - name: Write Version Metadata
        run: |
          # 必须在本 job 计算:此处 checkout 用 fetch-depth 0,与 build.gradle 的
          # versionCode(20000 + rev-list 全量计数)同源;prerelease job 是浅检出会算少
          version_code=$((20000 + $(git rev-list HEAD --count)))
          cat > ${{ github.workspace }}/apk/version.json <<EOF
          {"versionCode":${version_code},"versionName":"${{ env.VERSION }}","channel":"beta"}
          EOF
          cat ${{ github.workspace }}/apk/version.json

      - name: Upload App To Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado.${{ env.product }}.${{ env.type }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            ${{ github.workspace }}/apk/*.apk
            ${{ github.workspace }}/apk/version.json

      - name: Upload Mapping File To Artifact
        uses: actions/upload-artifact@v6
        with:
          name: legado.${{ env.product }}.${{ env.type }}.mapping
          if-no-files-found: error
          retention-days: 7
          path: ${{ github.workspace }}/mapping/mapping.txt

  test:
    name: Focused JVM regression tests
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RHINO_FORK_REPO: ${{ github.repository_owner }}/htmlunit-rhino-fork
      RHINO_FORK_REF: c758621a0df4ec5687901570dc355c1f98f32652
      CORE_JS_REPO: ${{ github.repository_owner }}/htmlunit-core-js
      CORE_JS_REF: e31799f290b50f99fe2cef1f14acd9725f69653c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.RHINO_FORK_REPO }}
          ref: ${{ env.RHINO_FORK_REF }}
          path: htmlunit-rhino-fork
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.CORE_JS_REPO }}
          ref: ${{ env.CORE_JS_REF }}
          path: htmlunit-core-js
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Install Forked htmlunit-core-js
        working-directory: htmlunit-core-js
        run: mvn --batch-mode --no-transfer-progress install -Dmaven.test.skip=true -Dgpg.skip=true -Dmaven.javadoc.skip=true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Run focused JVM regressions
        run: |
          chmod +x gradlew
          ./gradlew :app:testAppDebugUnitTest \
            --tests 'io.legado.app.data.entities.BookSourcePartLoginEntryTest' \
            --tests 'io.legado.app.lib.theme.AppThemeInstallerTest' \
            --tests 'io.legado.app.lib.theme.CoverCardBackgroundColorTest' \
            --tests 'io.legado.app.lib.theme.ThemeWiringContractTest' \
            --tests 'io.legado.app.model.AudioPlaySpeedTest' \
            --tests 'io.legado.app.model.ReadRecordMergeTest' \
            --tests 'io.legado.app.model.ReadRecordRestoreTest' \
            --tests 'io.legado.app.model.ReadRecordSessionTest' \
            --tests 'io.legado.app.ui.book.audio.AudioPlayLayoutTest' \
            --tests 'io.legado.app.ui.login.SourceCallbackJsExtensionsJsTest' \
            --tests 'io.legado.app.ui.login.SourceLoginBridgeTest' \
            --tests 'io.legado.app.ui.login.SourceLoginBridgeWiringTest' \
            --tests 'io.legado.app.ui.login.SourceLoginV2ToggleLayoutTest' \
            --tests 'io.legado.app.ui.login.SourceLoginWebViewLayoutTest' \
            --tests 'io.legado.app.ui.main.explore.ExploreModeCompatibilityTest' \
            --tests 'io.legado.app.ui.theme.HighlightTitleOptionTest' \
            --tests 'io.legado.app.ui.widget.image.CoverImageViewTest' \
            --tests 'io.legado.app.web.mcp.McpExploreInputsTest' \
            --tests 'io.legado.app.JsTest.analyzeRuleJavaDelegateRetainsStringOverloads' \
            --tests 'io.legado.app.JsTest.httpTtsJavaDelegateEncodesBaiduFormBody' \
            --tests 'io.legado.app.JsTest.analyzeUrlReturnsDataUriAsTextWithoutHttpRequest' \
            --no-daemon --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            --warning-mode all

  prerelease:
    needs: [ prepare, build, test ]
    permissions:
      contents: write
      actions: read
    if: github.event_name != 'pull_request' && github.repository == 'skybbk1001/legadoT'
    runs-on: ubuntu-latest
    env: 
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode 依赖完整历史；beta tag 也需要在本地可解析。
          fetch-depth: 0
      - name: Build Release Notes
        run: |
          prev="$(git rev-parse 'beta^{commit}' 2>/dev/null || echo '')"
          head="$(git rev-parse HEAD)"
          changelog="$RUNNER_TEMP/changelog.md"
          if [ -s "$GITHUB_WORKSPACE/CHANGELOG.md" ]; then
            sed "s#/blob/master/#/blob/${GITHUB_SHA}/#g" "$GITHUB_WORKSPACE/CHANGELOG.md" > "$changelog"
          else
            printf '%s\n' '## 更新日志' > "$changelog"
          fi
          {
            cat "$changelog"
            echo
            echo '<details>'
            echo '<summary>主线提交记录</summary>'
            echo
            if [ -n "$prev" ] && [ "$prev" != "$head" ] && git merge-base --is-ancestor "$prev" "$head"; then
              echo "自上一测试版以来的主线更新:"
              echo
              git log --first-parent --no-merges --pretty=format:"- %s" "$prev..HEAD"
            else
              # 首次发布、tag 缺失或历史被改写:退回最近 20 条主线提交
              git log --first-parent --no-merges --pretty=format:"- %s" -n 20 HEAD
            fi
            echo
            echo
            echo '</details>'
          } > "$GITHUB_WORKSPACE/release.md"
          cat "$GITHUB_WORKSPACE/release.md"
      - uses: actions/download-artifact@v5
        with:
          pattern: legado.app.release
          merge-multiple: true
          path: apk/

      - working-directory: apk/
        run: |
          shopt -s nullglob
          apk_files=(*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK downloaded from the build artifact."
            exit 1
          fi
          for file in "${apk_files[@]}"; do
            case "$file" in
              *原包名*) mv -- "$file" "${file/原包名/release}" ;;
            esac
          done
          test -s version.json

      - name: Create verified beta candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: beta-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          apk_files=("${{ github.workspace }}"/apk/*.apk)
          if [ "${#apk_files[@]}" -ne 3 ] || [ ! -s "${{ github.workspace }}/apk/version.json" ]; then
            echo "Expected 3 ABI APKs and a non-empty version.json."
            exit 1
          fi
          for file in "${apk_files[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty APK: $file"
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$CANDIDATE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$CANDIDATE_TAG"
          gh release create "$CANDIDATE_TAG" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "legado_app_${{ env.VERSION }}" \
            --notes-file "$GITHUB_WORKSPACE/release.md" \
            "${apk_files[@]}" \
            "$GITHUB_WORKSPACE/apk/version.json"

          asset_count=$(gh release view "$CANDIDATE_TAG" --json assets --jq '.assets | length')
          if [ "$asset_count" -ne 4 ]; then
            echo "Expected 4 beta assets, found $asset_count"
            exit 1
          fi
          remote_assets=$(gh release view "$CANDIDATE_TAG" --json assets --jq '[.assets[].name]')
          for file in "${apk_files[@]}" "$GITHUB_WORKSPACE/apk/version.json"; do
            name=$(basename "$file")
            if ! jq -e --arg name "$name" 'index($name) != null' <<< "$remote_assets" >/dev/null; then
              echo "Candidate release is missing asset: $name"
              exit 1
            fi
          done

      - name: Promote verified beta candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: beta-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          old_beta_commit=$(git rev-parse 'refs/tags/beta^{commit}' 2>/dev/null || echo '')
          old_beta_release_id=$(gh release view beta --json databaseId --jq '.databaseId' 2>/dev/null || echo '')
          candidate_release_id=$(gh release view "$CANDIDATE_TAG" --json databaseId --jq '.databaseId')
          if [ -n "$old_beta_release_id" ] && [ -z "$old_beta_commit" ]; then
            echo "The existing beta release has no resolvable beta tag; refusing promotion."
            exit 1
          fi

          beta_tag_update_attempted=false
          candidate_publish_attempted=false
          promotion_complete=false
          rollback_promotion() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$promotion_complete" != true ]; then
              echo "Promotion failed; restoring the previous beta where possible."
              if [ "$candidate_publish_attempted" = true ]; then
                gh api --method PATCH \
                  "/repos/$GITHUB_REPOSITORY/releases/$candidate_release_id" \
                  -f "tag_name=$CANDIDATE_TAG" -F draft=true -F prerelease=true || true
              fi
              if [ "$beta_tag_update_attempted" = true ]; then
                if [ -n "$old_beta_commit" ]; then
                  git push origin "$old_beta_commit:refs/tags/beta" --force || true
                else
                  git push origin --delete beta 2>/dev/null || true
                fi
              fi
            fi
            return "$status"
          }
          trap rollback_promotion EXIT

          # GitHub does not allow an already-published release to be renamed to
          # a backup tag. Delete the old beta only after candidate verification.
          if [ -n "$old_beta_release_id" ]; then
            gh release delete beta --yes --cleanup-tag
          elif [ -n "$old_beta_commit" ]; then
            git push origin --delete beta
          fi

          beta_tag_update_attempted=true
          git push origin "$GITHUB_SHA:refs/tags/beta" --force
          candidate_publish_attempted=true
          gh api --method PATCH \
            "/repos/$GITHUB_REPOSITORY/releases/$candidate_release_id" \
            -f tag_name=beta \
            -f "target_commitish=$GITHUB_SHA" \
            -f "name=legado_app_${{ env.VERSION }}" \
            -F draft=false \
            -F prerelease=true \
            -F make_latest=false

          promotion_complete=true
          trap - EXIT
          git push origin --delete "$CANDIDATE_TAG" || echo "Warning: candidate tag remains at $CANDIDATE_TAG"
          git tag -d "$CANDIDATE_TAG" 2>/dev/null || true

  lanzou:
    needs: [ prepare, build, test ]
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.lanzou == 'yes' }}
    runs-on: ubuntu-latest
    env:
      # 登录蓝奏云后在控制台运行document.cookie
      ylogin: ${{ secrets.LANZOU_ID }}
      phpdisk_info: ${{ secrets.LANZOU_PSD }}
      # 蓝奏云里的文件夹ID（阅读3测试版:2670621）
      LANZOU_FOLDER_ID: ${{ secrets.LANZOU_FOLDER_ID }}
      #蓝奏云分享链接
      LANZOU_URL: ${{ secrets.LANZOU_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: legado.app.release
          merge-multiple: true
          path: apk/
      - working-directory: apk/
        run: |
          shopt -s nullglob
          apk_files=(*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK downloaded from the build artifact."
            exit 1
          fi
          rm -f version.json
      - name: Upload To Lanzou
        continue-on-error: true
        run: |
          path="$GITHUB_WORKSPACE/apk/"
          python3 $GITHUB_WORKSPACE/.github/scripts/lzy_web.py "$path" "$LANZOU_FOLDER_ID"
          echo "[$(date -u -d '+8 hour' '+%Y.%m.%d %H:%M:%S')] 分享链接: $LANZOU_URL"

  telegram:
    needs: [ prepare, build, test ]
    if: ${{ github.event_name != 'pull_request' && needs.prepare.outputs.telegram == 'yes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          pattern: legado.app.release
          merge-multiple: true
          path: apk/
      - working-directory: apk/
        run: |
          shopt -s nullglob
          apk_files=(*.apk)
          if [ "${#apk_files[@]}" -eq 0 ]; then
            echo "No APK downloaded from the build artifact."
            exit 1
          fi
          for file in "${apk_files[@]}"; do
            target=$(printf '%s' "$file" | sed -e 's/_/ /g' -e 's/legado/阅读/')
            mv -- "$file" "$target"
          done
      - name: Post to channel via Telegram API
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CONTEXT: "#阅读 #Legado #Beta ${{ needs.prepare.outputs.versionL }}"
        run: |
          shopt -s nullglob
          files=(apk/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files prepared for Telegram."
            exit 1
          fi
          for file in "${files[@]}"; do
            response=$(curl --fail-with-body --silent --show-error --retry 2 \
              -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
              -F "chat_id=${CHANNEL_ID}" \
              -F "caption=${CONTEXT}" \
              -F "document=@${file}")
            if ! printf '%s' "$response" | jq -e '.ok == true' >/dev/null; then
              echo "Telegram rejected ${file}: ${response}"
              exit 1
            fi
          done
